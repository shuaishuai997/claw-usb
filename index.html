<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenClaw U盘版</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-color: #6366f1;
      --primary-hover: #818cf8;
      --success-color: #10b981;
      --success-hover: #34d399;
      --danger-color: #ef4444;
      --danger-hover: #f87171;
      --warning-color: #f59e0b;
      --warning-hover: #fbbf24;
      --info-color: #3b82f6;
      --info-hover: #60a5fa;
      --text-color: #e5e7eb;
      --text-muted: #9ca3af;
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-tertiary: #334155;
      --border-color: #334155;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -4px rgba(0, 0, 0, 0.4);
      --radius: 8px;
      --radius-lg: 12px;
      --radius-sm: 4px;
    }

    body {
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--bg-primary) 0%, #1a1a2e 100%);
      color: var(--text-color);
      overflow: hidden;
      min-height: 100vh;
    }

    .title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      background: linear-gradient(90deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
      padding: 0 16px;
      -webkit-app-region: drag;
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow);
    }

    .title-bar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .activation-status {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      background: var(--danger-color);
      color: white;
      box-shadow: 0 2px 4px rgba(239, 68, 68, 0.3);
      transition: all 0.3s ease;
    }

    .activation-status.active {
      background: var(--success-color);
      box-shadow: 0 2px 4px rgba(16, 185, 129, 0.3);
    }

    .logo {
      width: 28px;
      height: 28px;
      background-image: url('icon.ico');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      border-radius: var(--radius);
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-color);
      letter-spacing: 0.3px;
    }

    .title-bar-right {
      display: flex;
      gap: 6px;
      -webkit-app-region: no-drag;
    }

    .title-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      transition: all 0.2s ease;
      font-size: 14px;
    }

    .title-btn:hover {
      background: var(--bg-tertiary);
      color: var(--text-color);
    }

    .title-btn.close:hover {
      background: var(--danger-color);
      color: white;
    }

    .main-content {
      padding: 24px;
      height: calc(100vh - 48px);
      overflow-y: auto;
    }

    .header-section {
      text-align: center;
      margin-bottom: 32px;
    }

    .header-logo {
      width: 100px;
      height: 100px;
      background-image: url('icon.ico');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      border-radius: 20px;
      margin: 0 auto 20px;
      box-shadow: 0 10px 40px rgba(99, 102, 241, 0.35);
      transition: transform 0.3s ease;
    }

    .header-logo:hover {
      transform: scale(1.05);
    }

    .header-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-color);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .header-subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }

    .status-card {
      background: linear-gradient(135deg, var(--bg-secondary) 0%, #1e1e32 100%);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 14px;
      border: 1px solid var(--border-color);
      transition: all 0.3s ease;
      box-shadow: var(--shadow);
    }

    .status-card:hover {
      border-color: var(--primary-color);
      box-shadow: var(--shadow-lg);
    }

    .status-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
    }

    .status-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      animation: pulse 2s infinite;
      box-shadow: 0 0 8px currentColor;
    }

    .status-dot.running {
      background: var(--success-color);
      color: var(--success-color);
    }

    .status-dot.stopped {
      background: #666;
      color: #666;
      animation: none;
    }

    .status-dot.starting {
      background: #f59e0b;
      animation: pulse 0.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-title {
      font-size: 16px;
      font-weight: 600;
    }

    .status-title.running {
      color: #10b981;
    }

    .status-title.stopped {
      color: #666;
    }

    .status-title.starting {
      color: #f59e0b;
    }

    .status-desc {
      font-size: 12px;
      color: #888;
      margin-left: 24px;
    }

    .status-meta {
      display: flex;
      gap: 20px;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #3a3a5c;
      margin-left: 24px;
    }

    .meta-item {
      font-size: 12px;
      color: #666;
    }

    .meta-item span {
      color: #e0e0e0;
      margin-left: 5px;
    }

    .grid-section {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .grid-card {
      background: linear-gradient(135deg, #2d2d44 0%, #1e1e32 100%);
      border-radius: 12px;
      padding: 18px;
      border: 1px solid #3a3a5c;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .grid-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    .card-label {
      font-size: 11px;
      color: #666;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .card-value {
      font-size: 15px;
      font-weight: 600;
      color: #e0e0e0;
      margin-bottom: 12px;
    }

    .card-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }

    .status-badge.success {
      color: #10b981;
    }

    .status-badge.warning {
      color: #f59e0b;
    }

    .status-badge.error {
      color: #ef4444;
    }

    .status-icon {
      width: 16px;
      height: 16px;
      border-radius: 50%;
    }

    .status-icon.success {
      background: #10b981;
    }

    .status-icon.warning {
      background: #f59e0b;
    }

    .status-icon.error {
      background: #ef4444;
    }

    .btn-outline {
      padding: 6px 14px;
      border: 1px solid #3a3a5c;
      border-radius: 6px;
      background: transparent;
      color: #888;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-outline:hover {
      border-color: #667eea;
      color: #667eea;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-success {
      background: linear-gradient(135deg, var(--success-color) 0%, #059669 100%);
      color: white;
    }

    .btn-success:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);
      background: linear-gradient(135deg, var(--success-hover) 0%, var(--success-color) 100%);
    }

    .btn-success:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: linear-gradient(135deg, var(--bg-tertiary) 0%, #475569 100%);
      color: var(--text-color);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover:not(:disabled) {
      background: linear-gradient(135deg, #475569 0%, var(--bg-tertiary) 100%);
      border-color: var(--primary-color);
    }

    .btn-danger {
      background: linear-gradient(135deg, var(--danger-color) 0%, #dc2626 100%);
      color: white;
    }

    .btn-danger:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.35);
      background: linear-gradient(135deg, var(--danger-hover) 0%, var(--danger-color) 100%);
    }

    .btn-warning {
      background: linear-gradient(135deg, var(--warning-color) 0%, #d97706 100%);
      color: white;
    }

    .btn-warning:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.35);
      background: linear-gradient(135deg, var(--warning-hover) 0%, var(--warning-color) 100%);
    }

    .btn-info {
      background: linear-gradient(135deg, var(--info-color) 0%, #2563eb 100%);
      color: white;
    }

    .btn-info:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.35);
      background: linear-gradient(135deg, var(--info-hover) 0%, var(--info-color) 100%);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary-color) 0%, #4f46e5 100%);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
      background: linear-gradient(135deg, var(--primary-hover) 0%, var(--primary-color) 100%);
    }

    .btn-outline {
      background: transparent;
      color: var(--text-color);
      border: 1px solid var(--border-color);
    }

    .btn-outline:hover:not(:disabled) {
      border-color: var(--primary-color);
      color: var(--primary-color);
    }

    .logs-section {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
      border: 1px solid #3a3a5c;
    }

    .logs-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .logs-title {
      font-size: 14px;
      font-weight: 600;
      color: #e0e0e0;
    }

    .logs-clear {
      font-size: 12px;
      color: #667eea;
      cursor: pointer;
      transition: color 0.2s;
    }

    .logs-clear:hover {
      color: #818cf8;
    }

    .logs-content {
      background: #0d0d1a;
      border-radius: 8px;
      padding: 15px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 11px;
      color: #888;
      height: 140px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .logs-content::-webkit-scrollbar {
      width: 6px;
    }

    .logs-content::-webkit-scrollbar-track {
      background: #1a1a2e;
      border-radius: 3px;
    }

    .logs-content::-webkit-scrollbar-thumb {
      background: #3a3a5c;
      border-radius: 3px;
    }

    .bottom-actions {
      display: flex;
      gap: 15px;
    }

    .btn-large {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 14px 12px;
      border: none;
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      min-width: 85px;
    }

    .btn-icon {
      font-size: 20px;
      line-height: 1;
    }

    .btn-text {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: normal;
      text-align: center;
      line-height: 1.2;
      white-space: nowrap;
      text-shadow: none;
      backface-visibility: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .btn-large:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-danger {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: #fff;
    }

    .btn-danger:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }

    .btn-warning {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #fff;
    }

    .btn-warning:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
    }

    .btn-info {
      background: #3a3a5c;
      color: #e0e0e0;
      margin-left: auto;
    }

    .btn-info:hover {
      background: #4a4a7c;
    }

 

    .btn-text:hover {
      background: rgba(102, 126, 234, 0.1);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: linear-gradient(135deg, #2d2d44 0%, #1e1e32 100%);
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 450px;
      border: 1px solid #3a3a5c;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }

    .modal-close {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: #888;
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .modal-close:hover {
      background: #3a3a5c;
      color: #fff;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      color: #888;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #3a3a5c;
      border-radius: 8px;
      background: #1a1a2e;
      color: #fff;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      outline: none;
      border-color: #667eea;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 24px;
    }

    .license-info {
      background: #1a1a2e;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .license-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #3a3a5c;
    }

    .license-row:last-child {
      border-bottom: none;
    }

    .license-label {
      color: #888;
      font-size: 13px;
    }

    .license-value {
      color: #e0e0e0;
      font-size: 13px;
    }

    .license-value.active {
      color: #10b981;
    }

    .license-value.inactive {
      color: #ef4444;
    }

    .restore-warning {
      text-align: center;
      padding: 20px 0;
    }

    .restore-warning .warning-icon {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .restore-warning p {
      color: var(--text-color);
      font-size: 14px;
      margin-bottom: 10px;
    }

    .restore-warning .warning-text {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .feature-list {
      list-style: none;
      padding: 0;
      margin-top: 10px;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      font-size: 12px;
      color: #888;
    }

    .feature-item::before {
      content: '✓';
      color: #10b981;
    }

    .success-message {
      display: none;
      padding: 12px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid #10b981;
      border-radius: 8px;
      color: #10b981;
      font-size: 13px;
      margin-bottom: 16px;
      text-align: center;
    }

    .success-message.show {
      display: block;
    }

    .error-message {
      display: none;
      padding: 12px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid #ef4444;
      border-radius: 8px;
      color: #ef4444;
      font-size: 13px;
      margin-bottom: 16px;
      text-align: center;
    }

    .error-message.show {
      display: block;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.9);
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 2000;
    }

    .toast.show {
      opacity: 1;
    }

    .toast.success {
      background: rgba(16, 185, 129, 0.9);
    }

    .toast.error {
      background: rgba(239, 68, 68, 0.9);
    }

    @media (max-width: 768px) {
      .grid-section {
        grid-template-columns: 1fr;
      }
      
      .bottom-actions {
        flex-wrap: wrap;
      }
      
      .btn-large {
        flex: 1;
        min-width: 120px;
      }
    }
  </style>
</head>
<body>
  <div class="title-bar">
    <div class="title-bar-left">
      <div class="logo">O</div>
      <span class="title">OpenClaw U盘版 v1.1.1</span>
      <span class="activation-status" id="activation-status">未激活</span>
    </div>
    <div class="title-bar-right">
      <button class="title-btn" id="min-btn">
        <span style="font-size: 16px;">&#x2013;</span>
      </button>
      <button class="title-btn close" id="close-btn">
        <span style="font-size: 14px;">&#x00D7;</span>
      </button>
    </div>
  </div>

  <div class="main-content">
    <div class="header-section">
      <div class="header-logo">O</div>
      <div class="header-title">OpenClaw U盘版</div>
      <div class="header-subtitle">您的 AI 助手 · 数据安全 U盘 · 拔出即停止</div>
    </div>

    <div class="status-card" id="status-card">
      <div class="status-header">
        <div class="status-dot stopped" id="status-dot"></div>
        <span class="status-title stopped" id="status-title">OpenClaw 已停止</span>
      </div>
      <div class="status-desc" id="status-desc">点击启动按钮开始服务</div>
      <div class="status-meta" id="status-meta">
        <div class="meta-item">PID: <span id="pid-value">-</span></div>
        <div class="meta-item">端口: <span id="port-value">-</span></div>
        <div class="meta-item">运行时间: <span id="uptime-value">-</span></div>
      </div>
    </div>

    

    <div class="logs-section">
      <div class="logs-header">
        <span class="logs-title">运行日志</span>
        <span class="logs-clear" id="clear-logs">清空</span>
      </div>
      <div class="logs-content" id="logs-content"></div>
    </div>

    <div class="bottom-actions">
      <button class="btn-large btn-danger" id="stop-btn" disabled>
        <span class="btn-icon">⏹</span>
        <span class="btn-text">停止服务</span>
      </button>
      <button class="btn-large btn-success" id="start-btn">
        <span class="btn-icon">▶</span>
        <span class="btn-text">启动服务</span>
      </button>
     <button class="btn-large btn-info" id="dashboard-btn">
        <span class="btn-icon">🌐</span>
        <span class="btn-text">打开龙虾控制面板</span>
      </button>
      <button class="btn-large btn-secondary" id="api-btn">
        <span class="btn-icon">🔑</span>
        <span class="btn-text">API Key</span>
      </button>
   
      <button class="btn-large btn-danger" id="license-btn">
        <span class="btn-icon">🔐</span>
        <span class="btn-text">去激活</span>
      </button>
    
      <button class="btn-large btn-primary" id="setup-btn">
        <span class="btn-icon">⚙️</span>
        <span class="btn-text">一键初始化</span>
      </button>
    </div>
  </div>

  <div class="modal-overlay" id="api-modal">
    <div class="modal" style="width: 500px;">
      <div class="modal-header">
        <span class="modal-title">自定义配置</span>
        <button class="modal-close" id="api-modal-close">&#x00D7;</button>
      </div>
      <div class="success-message" id="api-success">配置保存成功！</div>
      <div class="error-message" id="api-error">请检查输入项</div>
      <div class="form-group">
        <label class="form-label">模型提供者</label>
        <select class="form-input" id="provider-select">
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">API Key</label>
        <input type="password" class="form-input" id="api-key-input" placeholder="请输入您的 API Key">
      </div>
      <div class="form-group">
        <label class="form-label">模型 ID</label>
        <input type="text" class="form-input" id="model-input" placeholder="如: gpt-4o, claude-opus-4-6, kimi-k2.5">
      </div>
      <div class="form-group" id="api-address-group" style="display: none;">
        <label class="form-label">API 地址</label>
        <input type="text" class="form-input" id="provider-url-input" placeholder="如：https://api.deepseek.com/v1">
      </div>
      <div class="form-group" id="api-type-group" style="display: none;">
        <label class="form-label">API 协议</label>
        <select class="form-input" id="api-type-select">
          <option value="openai-completions">OpenAI 兼容</option>
          <option value="anthropic-messages">Anthropic 兼容</option>
        </select>
      </div>
      <div class="form-group" id="test-group" style="display: none;">
        <button class="btn btn-secondary" id="test-model-btn" style="width: 100%">测试连接并获取模型列表</button>
      </div>
      <div class="form-group" id="model-list-group" style="display: none;">
        <label class="form-label">可用模型列表</label>
        <select class="form-input" id="model-list-select" style="max-height: 200px; overflow-y: auto;">
          <option value="">点击测试按钮获取模型列表</option>
        </select>
      </div>
      <div class="form-group" id="simple-test-group">
        <button class="btn btn-secondary" id="simple-test-btn" style="width: 100%">测试 API 连接</button>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="api-cancel">取消</button>
        <button class="btn btn-success" id="api-save">保存配置</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="license-modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">授权信息</span>
        <button class="modal-close" id="license-modal-close">&#x00D7;</button>
      </div>
      <div class="success-message" id="license-success">授权激活成功！</div>
      <div class="error-message" id="license-error">请输入有效的授权码</div>
      <div class="license-info" id="license-info">
        <div class="license-row">
          <span class="license-label">授权状态</span>
          <span class="license-value inactive" id="license-status">未激活</span>
        </div>
        <div class="license-row">
          <span class="license-label">授权密钥</span>
          <span class="license-value" id="license-key-display">******</span>
        </div>
        <div class="license-row">
          <span class="license-label">到期时间</span>
          <span class="license-value" id="license-expires">未设置</span>
        </div>
        <div class="license-row">
          <span class="license-label">授权功能</span>
          <div class="feature-list" id="feature-list">
            <li class="feature-item">微信接入</li>
            <li class="feature-item">API 调用</li>
            <li class="feature-item">一键恢复</li>
          </div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">输入授权码激活</label>
        <input type="text" class="form-input" id="license-key-input" placeholder="请输入授权码">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="license-cancel">取消</button>
        <button class="btn btn-success" id="license-activate">激活</button>
      </div>
    </div>
  </div>



  <script>
    const { ipcRenderer } = require('electron')

    const statusDot = document.getElementById('status-dot')
    const statusTitle = document.getElementById('status-title')
    const statusDesc = document.getElementById('status-desc')
    const logsContent = document.getElementById('logs-content')
    const startBtn = document.getElementById('start-btn')
    const stopBtn = document.getElementById('stop-btn')
    const apiModal = document.getElementById('api-modal')
    const licenseModal = document.getElementById('license-modal')
    const toast = document.getElementById('toast')
    const dashboardBtn = document.getElementById('dashboard-btn')
    const activationStatus = document.getElementById('activation-status')

    let startTime = null
    let uptimeInterval = null
    let isActivated = false

    const FUNCTIONAL_BUTTONS = [
      'start-btn', 'api-btn', 'setup-btn', 'restore-btn',
      'api-save', 'api-cancel', 'test-model-btn', 'simple-test-btn'
    ]

    function setFunctionalButtonsEnabled(enabled) {
      FUNCTIONAL_BUTTONS.forEach(btnId => {
        const btn = document.getElementById(btnId)
        if (btn) btn.disabled = !enabled
      })
    }

    const PROVIDER_CONFIG = {
      deepseek: { url: 'https://api.deepseek.com/v1', api: 'openai-completions' },
      openai: { url: 'https://api.openai.com/v1', api: 'openai-completions' },
      anthropic: { url: 'https://api.anthropic.com/v1', api: 'anthropic-messages' },
      moonshot: { url: 'https://api.moonshot.cn/v1', api: 'openai-completions' },
      minimax: { url: 'https://api.minimax.com/v1', api: 'anthropic-messages' },
      custom: { url: 'https://api.example.com/v1', api: 'openai-completions' }
    }

    const PROVIDER_LABELS = {
      deepseek: 'DeepSeek',
      openai: 'OpenAI',
      anthropic: 'Anthropic',
      moonshot: 'Moonshot (Kimi)',
      minimax: 'MiniMax',
      custom: 'Custom (自定义)'
    }

    function updateProviderUrl(providerId) {
      const config = PROVIDER_CONFIG[providerId]
      if (config) {
        document.getElementById('provider-url-input').value = config.url
        document.getElementById('api-type-select').value = config.api
      }
    }

    function initProviderSelect() {
      const providerSelect = document.getElementById('provider-select')
      const options = Object.keys(PROVIDER_CONFIG).map(key => 
        `<option value="${key}">${PROVIDER_LABELS[key] || key.toUpperCase()}</option>`
      ).join('')
      providerSelect.innerHTML = options
    }

    function checkSetupNeeded() {
      ipcRenderer.send('check-setup-needed')
    }

    function hideSetupButton() {
      const setupBtn = document.getElementById('setup-btn')
      if (setupBtn) {
        setupBtn.style.display = 'none'
      }
    }

    function showToast(message, type = 'info') {
      toast.textContent = message
      toast.className = `toast ${type} show`
      setTimeout(() => {
        toast.classList.remove('show')
      }, 3000)
    }

    document.getElementById('min-btn').addEventListener('click', () => {
      ipcRenderer.send('minimize-window')
    })

    document.getElementById('close-btn').addEventListener('click', () => {
      ipcRenderer.send('hide-window')
    })

    document.getElementById('clear-logs').addEventListener('click', () => {
      logsContent.textContent = ''
      addLog('[INFO] 日志已清空')
    })

    function addLog(message) {
      if (logsContent.textContent) {
        logsContent.textContent += '\n'
      }
      logsContent.textContent += message
      logsContent.scrollTop = logsContent.scrollHeight
    }

    function updateStatus(isRunning, isStarting = false) {
      if (isStarting) {
        statusDot.className = 'status-dot starting'
        statusTitle.className = 'status-title starting'
        statusTitle.textContent = 'OpenClaw 启动中...'
        statusDesc.textContent = '正在初始化服务，请稍候...'
        startBtn.dataset.running = ''
      } else if (isRunning) {
        statusDot.className = 'status-dot running'
        statusTitle.className = 'status-title running'
        statusTitle.textContent = 'OpenClaw 运行中'
        statusDesc.textContent = '已就绪，打开控制中开始使用'
        startTime = Date.now()
        startUptimeCounter()
        startBtn.dataset.running = 'true'
      } else {
        statusDot.className = 'status-dot stopped'
        statusTitle.className = 'status-title stopped'
        statusTitle.textContent = 'OpenClaw 已停止'
        statusDesc.textContent = '点击启动按钮开始服务'
        stopUptimeCounter()
        document.getElementById('pid-value').textContent = '-'
        document.getElementById('port-value').textContent = '-'
        document.getElementById('uptime-value').textContent = '-'
        startBtn.dataset.running = ''
      }
      startBtn.disabled = isRunning || isStarting || !isActivated
      stopBtn.disabled = !isRunning || !isActivated
      dashboardBtn.disabled = !isRunning || !isActivated
    }

    function startUptimeCounter() {
      stopUptimeCounter()
      uptimeInterval = setInterval(() => {
        const elapsed = Date.now() - startTime
        const hours = Math.floor(elapsed / 3600000)
        const minutes = Math.floor((elapsed % 3600000) / 60000)
        const seconds = Math.floor((elapsed % 60000) / 1000)
        document.getElementById('uptime-value').textContent = 
          `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`
      }, 1000)
    }

    function stopUptimeCounter() {
      if (uptimeInterval) {
        clearInterval(uptimeInterval)
        uptimeInterval = null
      }
    }

    ipcRenderer.send('get-service-status')

    ipcRenderer.on('log-update', (event, message) => {
      addLog(message)
      
      const portMatch = message.match(/port (\d+)/i)
      if (portMatch && document.getElementById('port-value').textContent === '-') {
        document.getElementById('port-value').textContent = portMatch[1]
      }
    })

    ipcRenderer.on('service-status', (event, status) => {
      updateStatus(status.isRunning)
      checkSetupNeeded()
      if (status.pid) {
        document.getElementById('pid-value').textContent = status.pid
      }
      if (status.port) {
        document.getElementById('port-value').textContent = status.port
      }
    })

    startBtn.addEventListener('click', async () => {
      updateStatus(false, true)
      addLog('[INFO] 正在启动 OpenClaw 服务...')
      ipcRenderer.send('start-service')
    })

    ipcRenderer.on('service-started', (event, data) => {
      updateStatus(true)
      document.getElementById('pid-value').textContent = data.pid
      document.getElementById('port-value').textContent = data.port || '3000'
      showToast('OpenClaw 服务启动成功！', 'success')
    })

    ipcRenderer.on('service-error', (event, error) => {
      updateStatus(false)
      addLog(`[ERROR] ${error}`)
      showToast(`启动失败: ${error}`, 'error')
    })

    stopBtn.addEventListener('click', async () => {
      addLog('[INFO] 正在停止 OpenClaw 服务...')
      ipcRenderer.send('stop-service')
    })

    ipcRenderer.on('service-stopped', () => {
      updateStatus(false)
      showToast('OpenClaw 服务已停止', 'info')
    })

    document.getElementById('api-btn').addEventListener('click', () => {
      ipcRenderer.send('get-all-config')
      apiModal.classList.add('show')
      
      const providerSelect = document.getElementById('provider-select')
      const apiAddressGroup = document.getElementById('api-address-group')
      const apiTypeGroup = document.getElementById('api-type-group')
      const testGroup = document.getElementById('test-group')
      const modelListGroup = document.getElementById('model-list-group')
      const simpleTestGroup = document.getElementById('simple-test-group')
      
      if (providerSelect.value === 'custom') {
        apiAddressGroup.style.display = 'block'
        apiTypeGroup.style.display = 'block'
        testGroup.style.display = 'block'
        modelListGroup.style.display = 'block'
        simpleTestGroup.style.display = 'none'
      } else {
        apiAddressGroup.style.display = 'none'
        apiTypeGroup.style.display = 'none'
        testGroup.style.display = 'none'
        modelListGroup.style.display = 'none'
        simpleTestGroup.style.display = 'block'
      }
    })

    document.getElementById('api-modal-close').addEventListener('click', () => {
      apiModal.classList.remove('show')
    })

    document.getElementById('api-cancel').addEventListener('click', () => {
      apiModal.classList.remove('show')
    })

    document.getElementById('provider-select').addEventListener('change', (e) => {
      updateProviderUrl(e.target.value)
      
      const apiAddressGroup = document.getElementById('api-address-group')
      const apiTypeGroup = document.getElementById('api-type-group')
      const testGroup = document.getElementById('test-group')
      const modelListGroup = document.getElementById('model-list-group')
      const simpleTestGroup = document.getElementById('simple-test-group')
      
      if (e.target.value === 'custom') {
        apiAddressGroup.style.display = 'block'
        apiTypeGroup.style.display = 'block'
        testGroup.style.display = 'block'
        modelListGroup.style.display = 'block'
        simpleTestGroup.style.display = 'none'
      } else {
        apiAddressGroup.style.display = 'none'
        apiTypeGroup.style.display = 'none'
        testGroup.style.display = 'none'
        modelListGroup.style.display = 'none'
        simpleTestGroup.style.display = 'block'
      }
    })

    ipcRenderer.on('api-key', (event, apiKey) => {
      document.getElementById('api-key-input').value = apiKey
    })

    document.getElementById('api-save').addEventListener('click', () => {
      const apiKey = document.getElementById('api-key-input').value
      const provider = document.getElementById('provider-select').value
      const model = document.getElementById('model-input').value
      const providerUrl = document.getElementById('provider-url-input').value
      const apiType = document.getElementById('api-type-select').value

      if (!model.trim()) {
        document.getElementById('api-error').classList.add('show')
        setTimeout(() => {
          document.getElementById('api-error').classList.remove('show')
        }, 3000)
        return
      }

      if (!apiKey.trim() && provider !== 'ollama') {
        document.getElementById('api-error').classList.add('show')
        setTimeout(() => {
          document.getElementById('api-error').classList.remove('show')
        }, 3000)
        return
      }

      document.getElementById('api-success').classList.add('show')
      
      ipcRenderer.send('apply-model-config', {
        provider,
        model: model.trim(),
        apiKey: apiKey.trim(),
        baseUrl: providerUrl.trim(),
        api: apiType
      })

      setTimeout(() => {
        document.getElementById('api-success').classList.remove('show')
        apiModal.classList.remove('show')
      }, 1500)
      showToast('配置保存成功！', 'success')
    })

    document.getElementById('test-model-btn').addEventListener('click', async () => {
      const provider = document.getElementById('provider-select').value
      const providerUrl = document.getElementById('provider-url-input').value
      const apiKey = document.getElementById('api-key-input').value
      const apiType = document.getElementById('api-type-select').value

      if (!providerUrl.trim()) {
        showToast('请先输入 API 地址', 'error')
        return
      }

      const testBtn = document.getElementById('test-model-btn')
      const originalText = testBtn.textContent
      testBtn.textContent = '测试中...'
      testBtn.disabled = true

      try {
        const response = await fetch(`${providerUrl.replace(/\/$/, '')}/models`, {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          }
        })

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`)
        }

        const data = await response.json()
        const modelListSelect = document.getElementById('model-list-select')
        
        if (data.data && Array.isArray(data.data)) {
          const options = data.data.map(model => 
            `<option value="${model.id}">${model.id} (${model.name || model.id})</option>`
          ).join('')
          modelListSelect.innerHTML = `<option value="">选择模型...</option>` + options
          showToast(`获取到 ${data.data.length} 个模型`, 'success')
        } else {
          modelListSelect.innerHTML = '<option value="">未找到模型列表</option>'
          showToast('未找到模型列表', 'error')
        }
      } catch (error) {
        const modelListSelect = document.getElementById('model-list-select')
        modelListSelect.innerHTML = '<option value="">测试失败</option>'
        showToast(`测试失败：${error.message}`, 'error')
      } finally {
        testBtn.textContent = originalText
        testBtn.disabled = false
      }
    })

    document.getElementById('model-list-select').addEventListener('change', (e) => {
      if (e.target.value) {
        document.getElementById('model-input').value = e.target.value
      }
    })

    document.getElementById('simple-test-btn').addEventListener('click', async () => {
      const providerUrl = document.getElementById('provider-url-input').value
      const apiKey = document.getElementById('api-key-input').value

      if (!providerUrl.trim()) {
        showToast('请先输入 API 地址', 'error')
        return
      }

      const testBtn = document.getElementById('simple-test-btn')
      const originalText = testBtn.textContent
      testBtn.textContent = '测试中...'
      testBtn.disabled = true

      try {
        const response = await fetch(`${providerUrl.replace(/\/$/, '')}/models`, {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          }
        })

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`)
        }

        const data = await response.json()
        if (data.data && Array.isArray(data.data)) {
          showToast(`连接成功！可用模型数：${data.data.length}`, 'success')
        } else {
          showToast('连接成功！', 'success')
        }
      } catch (error) {
        showToast(`测试失败：${error.message}`, 'error')
      } finally {
        testBtn.textContent = originalText
        testBtn.disabled = false
      }
    })

    ipcRenderer.on('model-config-applied', (event, result) => {
      if (result.success) {
        addLog('[INFO] 模型配置已更新')
      } else {
        showToast(`配置失败: ${result.error}`, 'error')
      }
    })

    document.getElementById('license-btn').addEventListener('click', () => {
      ipcRenderer.send('get-license')
      licenseModal.classList.add('show')
    })

    document.getElementById('license-modal-close').addEventListener('click', () => {
      licenseModal.classList.remove('show')
    })

    document.getElementById('license-cancel').addEventListener('click', () => {
      licenseModal.classList.remove('show')
    })

    ipcRenderer.on('setup-needed', (event, needed) => {
      if (!needed) {
        hideSetupButton()
      }
    })

    ipcRenderer.on('license', (event, license) => {
      const statusEl = document.getElementById('license-status')
      const expiresEl = document.getElementById('license-expires')
      const keyEl = document.getElementById('license-key-display')
      const activationStatus = document.getElementById('activation-status')
      
      if (license.activated) {
        isActivated = true
        statusEl.className = 'license-value active'
        statusEl.textContent = '已激活'
        expiresEl.textContent = license.expiresAt ? new Date(license.expiresAt).toLocaleDateString() : '永久'
        keyEl.textContent = license.licenseKey ? `${license.licenseKey.slice(0, 4)}...${license.licenseKey.slice(-4)}` : '未知'
        setFunctionalButtonsEnabled(true)
        activationStatus.textContent = '已激活'
        activationStatus.classList.add('active')
      } else {
        isActivated = false
        statusEl.className = 'license-value inactive'
        statusEl.textContent = '未激活'
        expiresEl.textContent = '未设置'
        keyEl.textContent = '-'
        setFunctionalButtonsEnabled(false)
        activationStatus.textContent = '未激活'
        activationStatus.classList.remove('active')
      }
    })

    document.getElementById('license-activate').addEventListener('click', async () => {
      const key = document.getElementById('license-key-input').value
      if (!key.trim()) {
        document.getElementById('license-error').classList.add('show')
        setTimeout(() => {
          document.getElementById('license-error').classList.remove('show')
        }, 3000)
        return
      }
      
      const activateBtn = document.getElementById('license-activate')
      const originalText = activateBtn.textContent
      activateBtn.textContent = '激活中...'
      activateBtn.disabled = true
      
      ipcRenderer.send('activate-license', key)
    })

    ipcRenderer.on('license-activated', (event, result) => {
      const activateBtn = document.getElementById('license-activate')
      activateBtn.textContent = '激活'
      activateBtn.disabled = false
      
      if (result.activated) {
        const successMsg = document.getElementById('license-success')
        successMsg.classList.add('show')
        ipcRenderer.send('get-license')
        setTimeout(() => {
          successMsg.classList.remove('show')
          licenseModal.classList.remove('show')
        }, 1500)
        showToast(result.message || '授权激活成功！', 'success')
      } else {
        showToast(result.message || '激活失败', 'error')
      }
    })

    ipcRenderer.on('license-invalid', () => {
      isActivated = false
      setFunctionalButtonsEnabled(false)
      showActivationRequired()
      showToast('授权验证失败，请重新激活', 'error')
    })

    document.getElementById('dashboard-btn').addEventListener('click', () => {
      addLog('[INFO] 正在打开网页端控制面板...')
      ipcRenderer.send('open-dashboard')
    })

    ipcRenderer.on('dashboard-opened', (event, result) => {
      if (result.success) {
        addLog('[SUCCESS] 网页端控制面板已打开')
        showToast('网页端控制面板已打开', 'success')
      } else {
        addLog(`[ERROR] 打开控制面板失败: ${result.error}`)
        showToast(`打开失败: ${result.error}`, 'error')
      }
    })

    document.getElementById('setup-btn').addEventListener('click', () => {
      addLog('[INFO] 正在执行一键初始化...')
      ipcRenderer.send('setup')
    })

    ipcRenderer.on('setup-completed', (event, result) => {
      if (result.success) {
        addLog('[SUCCESS] 一键初始化完成')
        showToast('一键初始化完成', 'success')
      } else {
        addLog(`[ERROR] 初始化失败：${result.error}`)
        showToast(`初始化失败：${result.error}`, 'error')
      }
    })

    initProviderSelect()
    setFunctionalButtonsEnabled(false)
    ipcRenderer.send('get-license')
    addLog('[INFO] OpenClaw U 盘版 v1.1.1 已启动')
  </script>
</body>
</html>
